apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    field.cattle.io/description: BilboMD Worker App
  labels:
    workload.user.cattle.io/workloadselector: apps.deployment-{{ .Values.namespace }}-{{ .Values.worker.name }}
  name: "{{ .Values.worker.name }}"
  namespace: "{{ .Values.namespace }}"
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      workload.user.cattle.io/workloadselector: apps.deployment-{{ .Values.namespace }}-{{ .Values.worker.name }}
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        workload.user.cattle.io/workloadselector: apps.deployment-{{ .Values.namespace }}-{{ .Values.worker.name }}
    spec:
      containers:
      - env:
        - name: NODE_ENV
          value: {{ .Values.env.NODE_ENV }}
        envFrom:
        - configMapRef:
            name: {{ .Values.namespace }}-config
            optional: false
        - secretRef:
            name: sfapi-priv-key
            # NERSC Superfacility key; absent on Diamond. optional: true there so
            # the pod starts without it (self-contained mode = persistence set).
            optional: {{ if .Values.persistence }}true{{ else }}false{{ end }}
        - secretRef:
            name: {{ .Values.namespace }}-secrets
            optional: false
        image: "{{ .Values.worker.image.registry }}/{{ .Values.worker.image.owner }}/{{ with .Values.worker.image.user }}{{ . }}/{{ end }}{{ with .Values.worker.image.repository }}{{ . }}{{ end }}:{{ .Values.worker.image.tag }}"
        imagePullPolicy: "{{ .Values.worker.image.pullPolicy }}"
        {{- if not .Values.persistence }}
        lifecycle:
          postStart:
            exec:
              command:
              - /app/scripts/nersc/sync-nersc-scripts-to-cfs.sh
        {{- end }}
        name: container-0
        # The worker serves a config/health server on port 3000 (GET /config).
        # Readiness gates Service membership (safe). Liveness is deliberately
        # LENIENT so a long-running MD job is never restarted mid-run — only a
        # truly hung worker (health server unresponsive for minutes) is recycled.
        readinessProbe:
          httpGet:
            path: /config
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /config
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 6
        # Values-driven; defaults to {} so existing (NERSC) renders are unchanged.
        # Diamond sets worker.resources (memory + nvidia.com/gpu) in values-diamond.yaml.
        resources: {{- toYaml (.Values.worker.resources | default dict) | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: false
          runAsUser: 62704
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /secrets
          name: vol-sfapi-priv-key
        - mountPath: /bilbomd/uploads
          name: vol-uploads
        - mountPath: /bilbomd/logs
          name: vol-logs
        - mountPath: /bilbomd/scripts
          name: vol-scripts
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: {{ .Values.worker.image.secret }}
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 104818
      terminationGracePeriodSeconds: 30
      volumes:
      - name: vol-sfapi-priv-key
        secret:
          defaultMode: 420
          secretName: sfapi-priv-key
          {{- if .Values.persistence }}
          optional: true
          {{- end }}
      # Shared job/results volume. Diamond: a ReadWriteMany PVC (set
      # persistence.uploads.claimName in values-diamond.yaml). NERSC (no
      # persistence key): unchanged hostPath onto CFS via the else branch.
      - name: vol-uploads
        {{- $uploadsClaim := "" }}
        {{- with .Values.persistence }}{{- with .uploads }}{{- $uploadsClaim = .claimName | default "" }}{{- end }}{{- end }}
        {{- if $uploadsClaim }}
        persistentVolumeClaim:
          claimName: {{ $uploadsClaim }}
        {{- else }}
        hostPath:
          path: {{ .Values.cfs_dir }}/{{ .Values.nersc_repo }}/{{ .Values.uploads }}
          type: Directory
        {{- end }}
      # Logs + scripts: NERSC uses CFS hostPaths (type: Directory, must pre-exist).
      # Diamond (persistence set) uses an emptyDir so the pod can start without CFS.
      - name: vol-logs
        {{- if .Values.persistence }}
        emptyDir: {}
        {{- else }}
        hostPath:
          path: {{ .Values.cfs_dir }}/{{ .Values.nersc_repo }}/{{ .Values.logs.worker }}
          type: Directory
        {{- end }}
      - name: vol-scripts
        {{- if .Values.persistence }}
        emptyDir: {}
        {{- else }}
        hostPath:
          path: {{ .Values.cfs_dir }}/{{ .Values.nersc_repo }}/{{ .Values.scripts }}
          type: Directory
        {{- end }}