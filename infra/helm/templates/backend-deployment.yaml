apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    field.cattle.io/description: BilboMD Backend App
  labels:
    workload.user.cattle.io/workloadselector: apps.deployment-{{ .Values.namespace }}-{{ .Values.backend.name }}
  name: "{{ .Values.backend.name }}"
  namespace: "{{ .Values.namespace }}"
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      workload.user.cattle.io/workloadselector: apps.deployment-{{ .Values.namespace }}-{{ .Values.backend.name }}
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        workload.user.cattle.io/workloadselector: apps.deployment-{{ .Values.namespace }}-{{ .Values.backend.name }}
    spec:
      affinity: {}
      containers:
      - envFrom:
        - configMapRef:
            name: {{ .Values.namespace }}-config
            optional: false
        - secretRef:
            name: {{ .Values.namespace }}-secrets
            optional: false
        - secretRef:
            name: sfapi-priv-key
            # NERSC-only secret; absent on Diamond -> optional there so the pod starts.
            optional: {{ if .Values.persistence }}true{{ else }}false{{ end }}
        image: "{{ .Values.backend.image.registry }}/{{ .Values.backend.image.owner }}/{{ with .Values.backend.image.user }}{{ . }}/{{ end }}{{ with .Values.backend.image.repository }}{{ . }}{{ end }}:{{ .Values.backend.image.tag }}"
        imagePullPolicy: "{{ .Values.backend.image.pullPolicy }}"
        name: container-0
        ports:
        - containerPort: 3500
          name: 3500tcp
          protocol: TCP
        # Backend serves GET /healthcheck on 3500 (returns 200 when healthy).
        readinessProbe:
          httpGet:
            path: /healthcheck
            port: 3500
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthcheck
            port: 3500
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        # Values-driven; defaults to {} so existing (NERSC) renders are unchanged.
        resources: {{- toYaml (.Values.backend.resources | default dict) | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: false
          runAsUser: 62704
        stdin: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        tty: true
        volumeMounts:
        - mountPath: /secrets
          name: vol-sfapi-priv-key
        - mountPath: /bilbomd/uploads
          name: vol-uploads
        - mountPath: /bilbomd/logs
          name: vol-logs
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: {{ .Values.backend.image.secret }}
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 104818
      terminationGracePeriodSeconds: 30
      volumes:
      - name: vol-sfapi-priv-key
        secret:
          defaultMode: 420
          secretName: sfapi-priv-key
          {{- if .Values.persistence }}
          optional: true
          {{- end }}
      # Shared job/results volume. Diamond: a ReadWriteMany PVC (set
      # persistence.uploads.claimName in values-diamond.yaml). NERSC (no
      # persistence key): unchanged hostPath onto CFS via the else branch.
      - name: vol-uploads
        {{- $uploadsClaim := "" }}
        {{- with .Values.persistence }}{{- with .uploads }}{{- $uploadsClaim = .claimName | default "" }}{{- end }}{{- end }}
        {{- if $uploadsClaim }}
        persistentVolumeClaim:
          claimName: {{ $uploadsClaim }}
        {{- else }}
        hostPath:
          path: {{ .Values.cfs_dir }}/{{ .Values.nersc_repo }}/{{ .Values.uploads }}
          type: Directory
        {{- end }}
      # Logs: NERSC uses a CFS hostPath (must pre-exist). Diamond (persistence set)
      # uses an emptyDir so the pod can start without CFS.
      - name: vol-logs
        {{- if .Values.persistence }}
        emptyDir: {}
        {{- else }}
        hostPath:
          path: {{ .Values.cfs_dir }}/{{ .Values.nersc_repo }}/{{ .Values.logs.backend }}
          type: Directory
        {{- end }}
