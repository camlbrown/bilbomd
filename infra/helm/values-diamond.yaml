# values-diamond.yaml — DRAFT (Phase 2 task M4)
# =============================================================================
# Diamond Light Source deployment values for the BilboMD Helm chart.
# The existing chart was authored for NERSC's "Spin" cluster; this file adapts
# it FOR Diamond. Placeholders <LIKE_THIS> must be filled from the k8s admin
# (see K8S_MEETING_CHECKLIST.md). This is a DRAFT — not finalised, not applied.
#
# HOW HELM MERGES: `helm ... -f values-diamond.yaml` always loads the chart's
# default values.yaml FIRST, then overlays this file. So this file only needs to
# OVERRIDE the Diamond-specific keys (below). NERSC keys it does not override
# (cfs_dir, nersc_repo, sfapi, pscratch) still come from values.yaml — see the
# REQUIRED TEMPLATE EDITS note about why the storage ones become irrelevant.
#
# -----------------------------------------------------------------------------
# TEMPLATE EDITS #1 and #2 ARE NOW APPLIED (values-gated; NERSC renders unchanged):
#
#   1. STORAGE (DONE): worker + backend `vol-uploads` switches from the CFS
#      hostPath to a PVC when persistence.uploads.claimName is set (below). NERSC
#      (no persistence key) still renders the hostPath. (Logs remain hostPath;
#      switch to an emptyDir/second PVC later if wanted.)
#
#   2. CONFIGMAP ENV (DONE): CARBONARA_EXEC + AUTOMD_SAXS_BIN are injected into
#      the bilbomd-config ConfigMap when the `pipelines` block (below) is set.
#      Without CARBONARA_EXEC=inprocess the worker would try `podman run` in-pod
#      and fail. (AUTOMD_SAXS_BIN is also baked into the image — belt-and-braces.)
#
# The former Diamond BLOCKERS (#4 sfapi secret, #5 logs/scripts hostPath, #6
# postStart hook) ARE NOW APPLIED — all gated on the `.Values.persistence` block
# (the "self-contained / Diamond" marker), so NERSC (no persistence key) renders
# byte-identical and Diamond pods can start:
#
#   4. SFAPI SECRET (DONE): worker + backend `secretRef: sfapi-priv-key` and the
#      `vol-sfapi-priv-key` secret volume are now `optional: true` on Diamond, so
#      the (absent) NERSC secret no longer blocks startup. Still set USE_NERSC=false
#      in the ConfigMap/values for Diamond.
#   5. LOGS/SCRIPTS (DONE): vol-logs + vol-scripts render as `emptyDir` on Diamond
#      instead of a CFS hostPath, so the pods start without CFS.
#   6. postStart HOOK (DONE): the NERSC CFS-sync postStart hook is gated off on
#      Diamond.
#   8. USE_NERSC / BILBOMD_DEPLOY_SITE (DONE): the ConfigMap now renders
#      USE_NERSC='false' + BILBOMD_DEPLOY_SITE=diamond on Diamond (persistence set)
#      so the worker runs MD in-pod instead of submitting to NERSC Slurm; NERSC
#      still renders 'true' / nersc.
#
# GENUINELY REMAINING (values-only / optional — not startup blockers):
#
#   3. WORKER RESOURCES/GPU: worker `resources` are values-driven; set
#      worker.resources below (memory + nvidia.com/gpu). Skip nvidia.com/gpu for a
#      web-tier-only first deploy.
#   7. IMAGE USER (optional): the combined worker image ends as root (the
#      automd-saxs Dockerfile does `USER root` and does not switch back); Helm
#      securityContext.runAsUser: 62704 overrides it at runtime. Optionally add
#      `USER 62704` at the end of that Dockerfile.
#   9. UI flag: ui-configmaps.yaml sets VITE_USE_NERSC="true" (a UI build/display
#      flag). Review whether Diamond wants it "false"; UI-only, not a blocker.
#
# NOTE: health probes (worker GET /config:3000, backend GET /healthcheck:3500) and
# values-driven resources are ALREADY added to the templates (Phase 2 task S2) and
# render as {} unless overridden — the worker/backend `resources:` below drive them.
# =============================================================================

# --- overrides of values.yaml top-level keys ---
namespace: <NAMESPACE>                 # e.g. bilbomd
docker_registry: <DIAMOND_REGISTRY>    # e.g. registry.diamond.ac.uk/bilbomd

# --- persistent volumes (Phase 2 task S4) ---
# Renders the optional PVC templates (templates/pvcs.yaml). NERSC has no
# `persistence` key so it renders nothing there. `create: true` provisions the
# three claims on install. Set `create: false` (or apply the PVCs by hand per
# K8S_DEPLOYMENT_RUNBOOK.md §7) if the admin pre-creates them.
persistence:
  create: true
  uploads:                              # shared job/results volume (backend + worker)
    claimName: bilbomd-uploads          # setting this switches the uploads volume
                                        # from hostPath to this PVC (template edit #1)
    accessMode: ReadWriteMany
    storageClass: <RWX_STORAGE_CLASS>
    size: <UPLOADS_SIZE>                # e.g. 500Gi
  mongo:
    claimName: mongodb-volume
    accessMode: ReadWriteOnce
    storageClass: <RWO_STORAGE_CLASS>
    size: <MONGO_SIZE>                  # e.g. 50Gi
  redis:
    claimName: redis-volume
    accessMode: ReadWriteOnce
    storageClass: <RWO_STORAGE_CLASS>
    size: <REDIS_SIZE>                  # e.g. 5Gi
# nersc_repo / cfs_dir / pscratch / sfapi are inherited from values.yaml but are
# NOT USED once storage is switched to a PVC (edit #1) and USE_NERSC=false.

ingress:
  host: '<UI_INGRESS_HOST>'            # internal ingress host, if applicable
  fqdn: '<UI_HOST>'                    # public DNS for the UI, e.g. bilbomd.diamond.ac.uk
  secret: '<TLS_SECRET>'              # k8s secret holding the UI TLS cert (or cert-manager)

bilbomd:
  url: 'https://<UI_HOST>'

env:
  NODE_ENV: 'production'
  BILBOMD_ENV: 'production'
  # USE_NERSC is false for Option A (MD runs in the worker pod, not on HPC).
  # If the ConfigMap templates USE_NERSC from values, set it false here; otherwise
  # set USE_NERSC: 'false' directly in bilbomd-configmaps.yaml.

auth:
  orcid_issuer: 'https://orcid.org'
  orcid_client_id: '<ORCID_CLIENT_ID>'
  orcid_redirect_uri: 'https://<UI_HOST>/api/v1/auth/orcid/callback'

# --- pipeline de-nesting for k8s (template edit #2, now applied via the ConfigMap) ---
# These inject CARBONARA_EXEC + AUTOMD_SAXS_BIN into the bilbomd-config ConfigMap.
# CARBONARA_EXEC=inprocess is REQUIRED on k8s (else the worker tries `podman run`).
# With 9a done, the worker image bakes in the Carbonara tools AND the CARBONARA_*
# paths (CARBONARA_PYTHON_BIN, CARBONARA_ROOT, CARBONARA_RUNNER, CARBONARA_CG2ALL_EXEC,
# CARBONARA_MULTIFOXS_BIN), so inprocess resolves them with no extra ConfigMap keys.
pipelines:
  carbonaraExec: inprocess
  automdSaxsBin: /opt/envs/openmm/bin/automd-saxs

# Log paths — only used if logs stay hostPath-style. With a PVC/emptyDir (edit #1)
# these become the sub-paths inside that volume.
logs:
  backend: 'logs/backend'
  worker: 'logs/worker'
  ui: 'logs/ui'
backups: 'backups'
scripts: 'scripts'
uploads: 'uploads'
working_dir: ''

# --- images: point at the Diamond registry + the ONE pinned combined worker tag ---
# NOTE: worker.repository is the COMBINED worker image = worker base + automd_saxs
# v0.1.1 + the Carbonara runtime baked in (task 9a), built per
# K8S_DEPLOYMENT_RUNBOOK.md §4.1 (three steps: branch worker -> +automd -> +carbonara).
# Both pipelines run in-pod from this ONE ~23 GB image (validated locally as the k8s
# non-root user). Use ONE tag everywhere (S3).

mongo:
  name: mongo
  image:
    repository: mongo
    tag: 8.2.6
    pullPolicy: IfNotPresent
    secret: <PULL_SECRET_NAME>
  config:
    MONGO_INITDB_ROOT_USERNAME: 'bilbomd-backend-user'

redis:
  name: redis
  image:
    repository: redis
    tag: 8.6.2
    pullPolicy: IfNotPresent
    secret: <PULL_SECRET_NAME>

ui:
  name: ui
  image:
    registry: <DIAMOND_REGISTRY>
    owner: <REGISTRY_OWNER>            # the path segment after the registry host, or null
    user: null
    repository: bilbomd-ui
    build: null
    tag: <IMAGE_TAG>
    pullPolicy: Always
    secret: <PULL_SECRET_NAME>

backend:
  name: backend
  image:
    registry: <DIAMOND_REGISTRY>
    owner: <REGISTRY_OWNER>
    user: null
    repository: bilbomd-backend
    build: null
    tag: <IMAGE_TAG>
    pullPolicy: Always
    secret: <PULL_SECRET_NAME>
  # Modest requests; the backend is not compute-heavy.
  resources:
    requests:
      cpu: '250m'
      memory: '512Mi'
    limits:
      memory: '1Gi'

worker:
  name: worker
  image:
    registry: <DIAMOND_REGISTRY>
    owner: <REGISTRY_OWNER>
    user: null
    repository: bilbomd-worker            # the COMBINED worker image (worker + automd-saxs v0.1.1)
    build: null
    tag: <IMAGE_TAG>
    pullPolicy: Always
    secret: <PULL_SECRET_NAME>
  # The worker runs MD in-pod (Option A). Set a memory request and (if GPU nodes
  # exist) request a GPU. Remove the nvidia.com/gpu line for a web-tier-only first
  # deploy. Numbers are placeholders — size with the admin.
  resources:
    requests:
      cpu: '1'
      memory: '<WORKER_MEM_REQUEST>'      # e.g. 8Gi
    limits:
      memory: '<WORKER_MEM_LIMIT>'        # e.g. 16Gi
      nvidia.com/gpu: <GPU_COUNT>         # e.g. 1  (delete this line if no GPU)
