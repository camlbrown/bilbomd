# BilboMD web-tier smoke test values for B21 (Phase 2: UI + backend + Mongo + Redis).
# Namespace is supplied at install time with `helm ... --namespace b21-beamline`.
# All storage is emptyDir for now (no persistence) — real PVCs come in Phase 3.
# Secrets live in the k8s Secret `bilbomd-secrets` (created out-of-band), NOT here.

# Credential the cluster uses to pull the private images (already created).
imagePullSecrets:
  - name: bilbomd-regcred

# Name of the pre-created Secret holding passwords/JWT secrets (see deploy steps).
secretName: bilbomd-secrets

# Shared job/results volume (RWX) — backend WRITES uploaded job files here and the
# worker (Phase 3b) READS them + writes results back. Confirmed the `netapp` class
# provisions ReadWriteMany. Kept across `helm uninstall` (resource-policy: keep).
uploads:
  claimName: bilbomd-uploads
  accessMode: ReadWriteMany
  storageClass: netapp
  size: 20Gi

# ---------------- UI (nginx) ----------------
ui:
  image:
    repository: gitlab.diamond.ac.uk:5050/kri42825/bilbomd/bilbomd-ui
    tag: latest
    pullPolicy: Always
  containerPort: 80
  service:
    type: ClusterIP
    port: 80
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 250m, memory: 128Mi }

# ---------------- Backend (Node API) ----------------
backend:
  image:
    repository: gitlab.diamond.ac.uk:5050/kri42825/bilbomd/bilbomd-backend
    tag: latest
    pullPolicy: Always
  containerPort: 3500
  # The UI's nginx proxies /api to `backend:3500`, so this Service MUST be `backend`.
  serviceName: backend
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: '1', memory: 1Gi }

# ---------------- MongoDB (in-cluster, emptyDir) ----------------
mongo:
  image:
    repository: mongo
    tag: 8.3.2
    pullPolicy: IfNotPresent
  serviceName: bilbomd-mongo
  port: 27017
  # Root user created on first start; the backend connects as this user (authSource=admin).
  # Username is non-secret (here); password comes from the Secret (MONGO_PASSWORD key).
  rootUsername: bilbomd-backend-user
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: '1', memory: 1Gi }

# ---------------- Redis (in-cluster, emptyDir) ----------------
redis:
  image:
    repository: redis
    tag: 8.8.0
    pullPolicy: IfNotPresent
  serviceName: bilbomd-redis
  port: 6379
  # TEMPORARY workaround: BilboMD's deleteBilboMDJobsWorker hardcodes the Redis
  # hostname as `redis` (instead of reading REDIS_HOST). This alias Service points
  # the name `redis` at our Redis pods so that worker resolves it. Remove once the
  # backend code is fixed to use REDIS_HOST (planned for a later backend rebuild).
  aliasService:
    enabled: true
    name: redis
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 256Mi }

# ---------------- Worker (BilboMD compute: Carbonara + AutoMD-SAXS) ----------------
worker:
  image:
    repository: gitlab.diamond.ac.uk:5050/kri42825/bilbomd/bilbomd-worker
    # Immutable tag (NOT :latest). :latest + IfNotPresent silently won't re-pull a
    # rebuilt image (the node keeps the cached digest); a distinct tag guarantees
    # the new image is pulled and leaves the old :latest intact for rollback.
    # chi2fix-20260810 = Carbonara mixture-χ² fixes (Stage 1 multi_foxs q-clamp +
    # Stage 2 IMP-foxs single-structure unify) + the PAE-path fix, all made live.
    tag: chi2fix-20260810
    # IfNotPresent, NOT Always: this image is ~23 GB — we don't want to re-pull it on
    # every restart. First schedule on a node pulls the new tag once (several minutes).
    pullPolicy: IfNotPresent
  containerPort: 3000   # the worker's internal config server (GET /config)
  # Phase 3b is CPU-only (runs Carbonara). GPU is added in Phase 3d for AutoMD-SAXS.
  gpu: 0
  # Sized for Carbonara's fit-level parallelism: the runner launches each of
  # `fit_n_times` as a background process, so the CPU LIMIT caps how many fits
  # run concurrently. B21 schedulable nodes top out at ~15.5 alloc cores
  # (serv-02) / 11.5 (serv-03); limit 12 bursts comfortably on both and is 3x
  # the old cap of 4. Small request (2) keeps this long-lived pod schedulable
  # anywhere without hogging reserved cores; the namespace LimitRange enforces
  # limit <= 10x request (12/2=6, 16Gi/4Gi=4, 10Gi/1Gi=10 — all OK).
  resources:
    requests: { cpu: '2',  memory: 4Gi,  ephemeral-storage: 1Gi }
    limits:   { cpu: '12', memory: 16Gi, ephemeral-storage: 10Gi }

# Placeholder backend Service — now OFF, because the real backend provides `backend`.
backendPlaceholder:
  enabled: false
  name: backend
  port: 3500

# Non-secret backend/worker environment (rendered into a ConfigMap).
# USE_NERSC=false, so the NERSC path values are inert placeholders.
config:
  NODE_ENV: production
  BILBOMD_ENV: production
  BILBOMD_URL: http://bilbomd-ui
  BILBOMD_FQDN: bilbomd-ui
  # Allow the browser origin used for port-forward testing through CORS. The backend
  # blocks any Origin not in its allowlist; the browser hits it at localhost:8080.
  # (For the real deployment, set BILBOMD_URL to the ingress URL instead.)
  CORS_ALLOWED_ORIGINS: http://localhost:8080
  USE_NERSC: 'false'
  BILBOMD_DEPLOY_SITE: diamond
  DATA_VOL: /bilbomd/uploads
  BILBOMD_LOGS: /bilbomd/logs
  EXAMPLE_DATA: /app/examples
  HOME: /tmp
  MPLCONFIGDIR: /tmp/matplotlib
  XDG_CACHE_HOME: /tmp/cache
  # Worker de-nesting: run pipelines IN-POD, not as nested containers. REQUIRED on
  # k8s (else CARBONARA_EXEC defaults to 'podman' and fails). AUTOMD_SAXS_BIN is also
  # baked into the image, but set here belt-and-braces. (Harmless for the backend.)
  CARBONARA_EXEC: inprocess
  AUTOMD_SAXS_BIN: /opt/envs/openmm/bin/automd-saxs
  # Mongo/Redis connection (hostnames = our Service names)
  MONGO_HOSTNAME: bilbomd-mongo
  MONGO_PORT: '27017'
  MONGO_DB: bilbomd
  MONGO_USERNAME: bilbomd-backend-user
  MONGO_AUTH_SRC: admin
  REDIS_HOST: bilbomd-redis
  REDIS_PORT: '6379'
  # Science tool paths (baked into the worker base image; harmless for the backend)
  CHARMM_TOPOLOGY: /app/scripts/bilbomd_top_par_files.str
  CHARMM_TEMPLATES: /app/build/templates/bilbomd
  CHARMM: /usr/local/bin/charmm
  FOXS: /usr/bin/foxs
  MULTIFOXS: /usr/bin/multi_foxs
  # NERSC-only values (unused because USE_NERSC=false) — present so required-env passes
  SFAPI_URL: https://example.invalid/api/v1
  SCRIPT_DIR: /tmp/nersc/scripts
  UPLOAD_DIR: /tmp/nersc/uploads
  WORK_DIR: /tmp/nersc/work
  PREPARE_CHARMM_SLURM_SCRIPT: /tmp/nersc/gen-charmm.py
  PREPARE_OMM_SLURM_SCRIPT: /tmp/nersc/gen-omm.py
  CP2CFS_SCRIPT: /tmp/nersc/cp2cfs.sh
  # ORCID (client id/redirect non-secret; the SECRET is in bilbomd-secrets).
  # Real login needs real values later; placeholders are fine to start the backend.
  ORCID_ISSUER: https://orcid.org
  ORCID_CLIENT_ID: placeholder-client-id
  ORCID_REDIRECT_URI: http://localhost/api/v1/auth/orcid/callback
  # Email off for the smoke test
  SEND_EMAIL_NOTIFICATIONS: 'false'
  SEND_EMAIL_USER: bilbomd@example.invalid
  # Feature flags
  ENABLE_BILBOMD_CARBONARA: 'true'
  ENABLE_BILBOMD_SANS: 'false'
  ENABLE_BILBOMD_MULTI: 'false'
  ENABLE_BILBOMD_ALPHAFOLD: 'true'
