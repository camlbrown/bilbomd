apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.redis.serviceName }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.redis.serviceName }}
  template:
    metadata:
      labels:
        app: {{ .Values.redis.serviceName }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          command: ["redis-server"]
          ports:
            - name: redis
              containerPort: {{ .Values.redis.port }}
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.redis.serviceName }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.redis.serviceName }}
  ports:
    - name: redis
      port: {{ .Values.redis.port }}
      targetPort: redis
{{- if .Values.redis.aliasService.enabled }}
---
# TEMPORARY alias so the backend's hardcoded-`redis` cleanup worker resolves.
# Same pods as bilbomd-redis. Remove when the backend reads REDIS_HOST properly.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.redis.aliasService.name }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: redis-alias
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.redis.serviceName }}
  ports:
    - name: redis
      port: {{ .Values.redis.port }}
      targetPort: redis
{{- end }}
