apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.mongo.serviceName }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.mongo.serviceName }}
  template:
    metadata:
      labels:
        app: {{ .Values.mongo.serviceName }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: mongo
    spec:
      containers:
        - name: mongo
          image: "{{ .Values.mongo.image.repository }}:{{ .Values.mongo.image.tag }}"
          imagePullPolicy: {{ .Values.mongo.image.pullPolicy }}
          ports:
            - name: mongo
              containerPort: {{ .Values.mongo.port }}
          env:
            # Root user created on first start. Username is non-secret (ConfigMap);
            # password comes from the Secret so the backend can match it.
            - name: MONGO_INITDB_ROOT_USERNAME
              value: {{ .Values.mongo.rootUsername | quote }}
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: MONGO_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            {{- toYaml .Values.mongo.resources | nindent 12 }}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.mongo.serviceName }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mongo
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.mongo.serviceName }}
  ports:
    - name: mongo
      port: {{ .Values.mongo.port }}
      targetPort: mongo
