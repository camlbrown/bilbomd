name: base
# conda-forge only (was: defaults, conda-forge). Anaconda's `defaults` channel
# (repo.anaconda.com) carries commercial-license restrictions and is blocked/
# unreachable on many build hosts (incl. DLS beamline workstations), which fails the
# image build. All packages below are available on conda-forge; `nodefaults` stops
# conda falling back to repo.anaconda.com so the build is portable.
channels:
  - conda-forge
  - nodefaults

dependencies:
  - pillow
  - six
  - wheel
  - numpy
  - scipy
  - matplotlib
  - python-igraph
  - pyyaml
  - biopython
